name: Build Windows VST3

on:
  push:
    branches: [ main, 'claude/**' ]
    paths: [ 'Source/**', 'wxCrusher.jucer', '.github/**' ]
  workflow_dispatch:

defaults:
  run:
    # bash 는 pluginval 이 끝날 때까지 기다리고 실패하면 단계를 실패로 만듭니다. (PowerShell 은 안 기다림)
    shell: bash

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.15
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: JUCE

      - name: Configure
        run: cmake -S .github/ci -B build -A x64

      - name: Build
        run: |
          cmake --build build --config Release --target wxCrusher_VST3 --parallel 2>&1 | tee build.log
          echo "---- MSVC warnings in Source/ ----"
          grep -i "Source[\\/].*warning" build.log || echo "none"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip -d pluginval || 7z x -y -opluginval pluginval.zip
          ./pluginval/pluginval.exe --strictness-level 10 --validate "build/wxCrusher_artefacts/Release/VST3/wxCrusher.vst3"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: wxCrusher-VST3-Windows
          path: build/wxCrusher_artefacts/Release/VST3/
