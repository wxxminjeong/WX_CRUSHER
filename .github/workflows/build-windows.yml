name: Build Windows VST3

on:
  push:
    branches: [ main, 'claude/**' ]
    paths: [ 'Source/**', 'wxCrusher.jucer', '.github/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.15
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: JUCE

      - name: Configure
        run: cmake -S .github/ci -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target wxCrusher_VST3 --parallel

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate "build/wxCrusher_artefacts/Release/VST3/wxCrusher.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: wxCrusher-VST3-Windows
          path: build/wxCrusher_artefacts/Release/VST3/
